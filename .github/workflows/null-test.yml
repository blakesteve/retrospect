name: Null test

# The full null-data test (spec 6.3): made-up histories with no sky effect,
# the 12 questions run on each as the answers endpoint runs them. It fails
# when more than 13% of any set get any Yes: the 1,000 of about four years or
# more, each band of younger ones, and those built at the 6-event floor
# (28 Oct 2026), or when a question is tested below the floor. The two sets
# run as two jobs side by side, so the wait is the longer one. It runs on
# pull requests that touch anything it reads: the engine and the answer rule,
# and what they import (walked from src/lib/answers/nullTrials.ts, 5 Oct
# 2026). An import added outside these paths is caught by the Monday run,
# after the merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/answers/**"
      - "src/lib/analysis/**"
      - "src/lib/sky/**"
      - "src/lib/ephemeris/**"
      - "src/lib/space/**"
      - "src/lib/store/**"
      - "src/lib/listener/songs.ts"
      - "src/lib/listener/spaceNights.ts"
      - "src/lib/zone.ts"
      - "src/lib/noise.ts"
      - "package-lock.json"
      - "scripts/null-test.mjs"
      - ".github/workflows/null-test.yml"
  schedule:
    # Mondays at 09:00 UTC, 4 a.m. CDT.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  null-test:
    name: Null test (${{ matrix.set }})
    # Ubuntu 24.04, as ci.yml's jobs are (it says why: ClickUp 86e3v3jtd).
    runs-on: ubuntu-24.04
    # The 1,000 ("full"): about a minute locally on 11 threads; a runner has
    # 3 to spare. Healthy in CI: 3.5 to 4.8 minutes over 7 green runs, 11 to
    # 19 Oct 2026. The young set: about 780 CPU seconds locally on 28 Oct, on
    # a busy machine, so about 4 to 5 minutes on 3 threads. About two and a
    # half times the slower, as ci.yml's ceilings are.
    timeout-minutes: 12
    strategy:
      # Each set's figures stand on their own: one failing doesn't stop the other.
      fail-fast: false
      matrix:
        set: [full, young]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Null test, ${{ matrix.set }}
        run: npm run null-test
        env:
          NULL_SET: ${{ matrix.set }}
