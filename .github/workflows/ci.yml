name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Every job runs on Ubuntu 24.04, not ubuntu-latest: since 22 Oct 2026
# ubuntu-latest is 26.04, where Playwright 1.58.2 can't install its browsers,
# so the browser checks failed before any test (ClickUp 86e3v3jtd). The other
# jobs are pinned with it, so every job runs on the system all of them ran on
# until then.
#
# Every job has a ceiling, so a stall fails inside a stated bound instead of
# at GitHub's six hours (Roster's CI sat 52 minutes on a slow apt mirror on
# 23 Oct). Each is about two and a half times the job's slowest healthy run,
# and never under 10 minutes, room for an install with a cold npm cache.
# Healthy runs are the 11 green CI runs from 11 to 22 Oct 2026.

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    # Healthy: 0.8 to 1.4 minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    # Healthy: 0.6 to 0.9 minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  browser:
    name: Browser checks
    runs-on: ubuntu-24.04
    # Healthy: 2.5 to 4.2 minutes, the system libraries from apt included.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium's headless shell, cached by Playwright's version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The build runs both bundle guards (postbuild).
      - name: Build
        run: npm run build

      # Served from a fresh folder holding only the made-up sample listener.
      - name: Browser checks
        run: npm run test:browser

      - name: Keep the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-failures
          path: test-results/
          retention-days: 7
